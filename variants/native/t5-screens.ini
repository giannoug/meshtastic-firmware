; Host render of the T5 S3 E-paper InkHUD screens (test/test_t5_screens). Builds the real InkHUD and
; T5 sources on Linux; the T5 hardware glue and the panel driver are replaced by the suite's own files.
;   pio test -e native-t5-screens -f test_t5_screens
[env:native-t5-screens]
extends = env:native
build_flags = ${env:native.build_flags}
  ${inkhud.build_flags}
  -I test/test_t5_screens/host
  -include test/test_t5_screens/host/t5_host_prelude.h
  -I variants/esp32s3/t5s3_epaper
  -D T5_SCREENS_HOST
  -D T5_S3_EPAPER_PRO
  -D T5_S3_EPAPER_PRO_V2
  -Wl,--wrap=_ZN3GFX5writeEh
  -Wl,--wrap=_ZN3GFX8drawRectEsssst
  -Wl,--wrap=_ZN3GFX8fillRectEsssst
  -Wl,--wrap=_ZN3GFX8drawLineEsssst
build_src_filter = ${env:native.build_src_filter}
  ${inkhud.build_src_filter}
  +<platform/extra_variants/t5s3_epaper/>
  -<platform/extra_variants/t5s3_epaper/variant.cpp>
  -<graphics/eink/>
  -<graphics/niche/Drivers/EInk/>
  +<graphics/niche/Drivers/EInk/EInk.cpp>
lib_deps =
  ${inkhud.lib_deps}
  ${env:native.lib_deps}
test_filter =
  test_t5_screens
